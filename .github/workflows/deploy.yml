name: Deploy to Hostinger (cargo.playb.in)

# Auto-publish on every push to the branches below. GitHub builds the app
# (Composer + Vite), then publishes a fully-built copy to the `hostinger-live`
# branch. Hostinger's own Git integration pulls that branch server-side (fast,
# and never blocked by its firewall — unlike SSH/FTP from CI).
# One-time setup + how the pull is triggered: docs/DEPLOY_HOSTINGER.md.

on:
  push:
    branches:
      - main
      - claude/transoria-online-design-yltaxe
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write   # allow pushing the built branch with GITHUB_TOKEN

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Build the Vue SPA -------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Stage SPA into Laravel public/
        run: |
          rm -rf backend/public/assets backend/public/index.html
          cp -r frontend/dist/. backend/public/

      # --- Build the Laravel app --------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath, ctype, curl, dom, fileinfo, xml
          tools: composer:v2

      - name: Install backend dependencies (production)
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # --- Publish the built app to the `hostinger-live` branch --------------
      # The branch's ROOT is the Laravel app (artisan, app/, public/, vendor/…),
      # so when Hostinger pulls it into public_html/cargo the app lands directly.
      # A fresh history is force-pushed each time (no repo bloat). .env, VCS,
      # the local dev DB and tests are never published.
      - name: Publish built app to hostinger-live branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd backend
          rm -rf .git
          # Keep runtime + secret files out of the published branch.
          rm -f .env .env.* database/database.sqlite
          rm -rf tests node_modules
          git init -q
          git config user.email "deploy@transoria.local"
          git config user.name "Transoria Deploy Bot"
          git checkout -q -b hostinger-live
          git add -A
          git commit -q -m "Built release ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger-live
          echo "Published built app to hostinger-live."
