name: Deploy to Hostinger (cargo.playb.in)

# Auto-publish on every push to the branches below. GitHub builds the app
# (Composer + Vite), then rsyncs it to Hostinger over SSH and runs the
# database migrations + cache warmup remotely. Configure the repository
# Secrets listed under `env:` before the first run (see docs/DEPLOY_HOSTINGER.md).

on:
  push:
    branches:
      - main
      - claude/transoria-online-design-yltaxe
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Build the Vue SPA -------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Stage SPA into Laravel public/
        run: |
          rm -rf backend/public/assets backend/public/index.html
          cp -r frontend/dist/. backend/public/

      # --- Build the Laravel app --------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath, ctype, curl, dom, fileinfo, xml
          tools: composer:v2

      - name: Install backend dependencies (production)
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # --- Deploy over FTP ---------------------------------------------------
      # Hostinger's firewall blocks SSH from cloud/CI IPs, so we transfer over
      # FTP (which it allows). The action keeps a sync-state file on the server
      # and only uploads changed files, so after the first (slow) upload each
      # deploy is fast. Database migrations are run once by you from your own
      # machine's SSH — see docs/DEPLOY_HOSTINGER.md.
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./backend/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Never upload secrets, VCS, the local dev DB, node modules or tests.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.*
            database/database.sqlite
            tests/**
